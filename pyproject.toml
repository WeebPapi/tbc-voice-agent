[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbc-voice-agent"
version = "0.1.0"
description = "TBC outbound collections voice assistant POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "openai>=1.54.0",
  "elevenlabs>=2.0.0,<3",
  "websockets>=13.0,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "anyio>=4.6.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tbc_voice_agent*", "mock_tbc*", "apps*"]
exclude = ["tests*", "apps.web*", "work*", "node_modules*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
